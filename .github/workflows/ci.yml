name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # B4 gate: fails on an unsolvable level, a malformed level, or a period
      # that does not divide 24; regenerates levels/levels.json.
      - run: npm run validate
      # levels.json is generated, never hand-edited: it must be committed and
      # identical to what the compiler produces from the .lvl files.
      - run: git diff --exit-code -- levels/levels.json
      - run: npm run build

  # Preview URL per PR (story A1) is handled natively by Cloudflare Pages:
  # the GitHub repo is connected to the Pages project `yap-corp-perfect-crime`
  # (docs/NAMING.md), which builds every PR as a preview deployment and deploys
  # `main` to production. No wrangler job (and no API secrets) needed here.
