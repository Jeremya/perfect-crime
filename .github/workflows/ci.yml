name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run validate
      - run: npm run build

  # One preview URL per PR (story A1), deployed to Cloudflare Pages.
  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Yap Corp nomenclature (docs/NAMING.md): the Pages project is
          # yap-corp-perfect-crime. Create it once in the Cloudflare dashboard.
          command: pages deploy dist --project-name=yap-corp-perfect-crime --branch=pr-${{ github.event.pull_request.number }}
